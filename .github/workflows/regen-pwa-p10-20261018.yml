name: Regenerate PWA P10 burned aftermath release
on:
  push:
    branches:
      - fix/core5-p10-fire-toll-boundary-2026-10-18
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/core5-p10-fire-toll-boundary-2026-10-18
      - name: Rebuild deterministic shell
        run: node scripts/build-pwa-shell.cjs
      - name: Commit generated shell
        run: |
          if git diff --quiet -- service-worker.js; then
            echo "PWA shell already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add service-worker.js
          git commit -m "Regenerate PWA 5.1.17 P10 shell"
          git push
