name: Temporary PWA shell regeneration
on:
  push:
    branches:
      - fix/mismatched-done-journal-reset-2026-10-17
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mismatched-done-journal-reset-2026-10-17
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate deterministic PWA shell
        run: node scripts/build-pwa-shell.cjs
      - name: Commit generated shell when changed
        run: |
          if git diff --quiet -- service-worker.js; then
            echo "PWA shell already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add service-worker.js
          git commit -m "Regenerate PWA shell for stale journal reset"
          git push origin HEAD:fix/mismatched-done-journal-reset-2026-10-17
