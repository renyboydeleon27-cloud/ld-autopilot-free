name: LDB offline delivery contract
on:
  pull_request:
    paths:
      - 'tests/test_ldb_delivery_contract.py'
      - 'tests/test_ldb_restart_recovery.py'
      - '.github/workflows/ldb-delivery-contract.yml'
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline delivery contract tests
        run: python -m unittest discover -s tests -p 'test_ldb_*.py' -v
