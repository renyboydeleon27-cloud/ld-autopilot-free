name: LDB offline delivery contract
on:
  pull_request:
    paths:
      - 'tests/test_ldb_delivery_contract.py'
      - 'tests/test_ldb_restart_recovery.py'
      - '.github/workflows/ldb-delivery-contract.yml'
      - 'tests/ldb-delivery-coordinator-gate.test.mjs'
      - 'tests/production-delivery-69-offline.test.mjs'
      - 'tests/ldb-google-delivery.test.mjs'
      - 'lib/ldb/google-delivery.mjs'
      - 'lib/ldb/production-delivery.mjs'
      - 'lib/ldb/delivery-coordinator-gate.mjs'
      - 'cloudflare/ldb-runner/delivery-alarm.mjs'
      - 'cloudflare/ldb-runner/worker.mjs'
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run coordinator gate tests
        run: node --test tests/ldb-delivery-coordinator-gate.test.mjs tests/ldb-google-delivery.test.mjs tests/production-delivery-69-offline.test.mjs
      - name: Run offline delivery contract tests
        run: python -m unittest discover -s tests -p 'test_ldb_delivery_contract.py' -v && python -m unittest discover -s tests -p 'test_ldb_restart_recovery.py' -v
