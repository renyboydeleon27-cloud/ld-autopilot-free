name: LDB Auto Studio approval checks
on:
  push:
    paths:
      - "ldb-auto-studio.html"
      - "scripts/verify_ldb_approval.py"
      - "tests/test_ldb_approval.py"
      - "scripts/ldb*.py"
      - "scripts/ldb_profiles/**"
      - "tests/test_ldb*.py"
      - "tests/ldb-auto-studio-ui.test.cjs"
      - "tests/*delivery*.test.mjs"
      - "tests/durable-*.test.mjs"
      - "lib/ldb/**"
      - "cloudflare/ldb-runner/**"
      - "cloudflare/ldb-google-vault/**"
      - ".github/workflows/ldb-free-production.yml"
      - ".github/workflows/ldb-auto-studio-tests.yml"
  pull_request:
    paths:
      - "ldb-auto-studio.html"
      - "scripts/verify_ldb_approval.py"
      - "tests/test_ldb_approval.py"
      - "scripts/ldb*.py"
      - "scripts/ldb_profiles/**"
      - "tests/test_ldb*.py"
      - "tests/ldb-auto-studio-ui.test.cjs"
      - "tests/*delivery*.test.mjs"
      - "tests/durable-*.test.mjs"
      - "lib/ldb/**"
      - ".github/workflows/ldb-free-production.yml"
      - ".github/workflows/ldb-auto-studio-tests.yml"
permissions:
  contents: read
jobs:
  approval-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install Pillow==12.3.0
      - run: python -m unittest discover -s tests -p 'test_ldb*py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/ldb-auto-studio-ui.test.cjs
      - name: Verify 69-file offline delivery and durable storage
        run: node --test tests/production-delivery-69-offline.test.mjs tests/durable-text-assets.test.mjs tests/durable-delivery-asset-reader.test.mjs tests/resume-durable-approved-delivery.test.mjs tests/delivery-readiness.test.mjs tests/submit-durable-approved-delivery.test.mjs tests/ldb-google-delivery-bridge.test.mjs
