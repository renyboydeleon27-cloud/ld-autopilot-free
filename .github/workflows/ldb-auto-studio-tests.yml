name: LDB Auto Studio approval checks
on:
  push:
    paths:
      - "ldb-auto-studio.html"
      - "scripts/verify_ldb_approval.py"
      - "tests/test_ldb_approval.py"
      - "scripts/ldb*.py"
      - "scripts/ldb*.mjs"
      - "scripts/ldb*.js"
      - "api/ldb-*.js"
      - "scripts/ldb_profiles/**"
      - "tests/test*.py"
      - "tests/*.test.mjs"
      - "tests/*.test.cjs"
      - "tests/ldb*.test.mjs"
      - "tests/ldb*.test.cjs"
      - "tests/production-milestones-stop.test.mjs"
      - "tests/verified-image-handoff.test.mjs"
      - "tests/persisted-runner-images.test.mjs"
      - "tests/*delivery*.test.mjs"
      - "tests/durable-*.test.mjs"
      - "tests/ldb-production-controls.test.mjs"
      - "lib/ldb/**"
      - "cloudflare/ldb-runner/**"
      - "cloudflare/ldb-google-vault/**"
      - ".github/workflows/ldb-free-production.yml"
      - ".github/workflows/ldb-hook-v5-one-shot.yml"
      - ".github/workflows/ldb-auto-studio-tests.yml"
  pull_request:
    paths:
      - "ldb-auto-studio.html"
      - "scripts/verify_ldb_approval.py"
      - "tests/test_ldb_approval.py"
      - "scripts/ldb*.py"
      - "scripts/ldb*.mjs"
      - "scripts/ldb*.js"
      - "api/ldb-*.js"
      - "scripts/ldb_profiles/**"
      - "tests/test*.py"
      - "tests/*.test.mjs"
      - "tests/*.test.cjs"
      - "tests/ldb*.test.mjs"
      - "tests/ldb*.test.cjs"
      - "tests/production-milestones-stop.test.mjs"
      - "tests/verified-image-handoff.test.mjs"
      - "tests/persisted-runner-images.test.mjs"
      - "tests/*delivery*.test.mjs"
      - "tests/durable-*.test.mjs"
      - "tests/ldb-production-controls.test.mjs"
      - "lib/ldb/**"
      - "cloudflare/ldb-runner/**"
      - "cloudflare/ldb-google-vault/**"
      - ".github/workflows/ldb-free-production.yml"
      - ".github/workflows/ldb-hook-v5-one-shot.yml"
      - ".github/workflows/ldb-auto-studio-tests.yml"
permissions:
  contents: read
jobs:
  approval-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install Pillow==12.3.0
      - run: python -m unittest discover -s tests -p 'test*.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify complete offline JavaScript regression suite
        run: node --test tests/*.test.mjs tests/*.test.cjs
      - name: Rehearse approved HOOK package without provider access
        run: node scripts/ldb-hook-v5-offline-readiness.mjs
      - name: One-batch safety boundary (offline only)
        run: |
          {
            echo '### NER AUTO STUDIO — One-batch verification'
            echo 'Offline test pass does not authorize Cloudflare inference, visual approval, 69-file Google delivery, Gmail milestones, or production release.'
            echo 'Release status: NO-GO pending fresh Free plan/quota check and actual end-to-end acceptance.'
          } >> "$GITHUB_STEP_SUMMARY"
