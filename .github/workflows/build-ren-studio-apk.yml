name: Build REN STUDIO APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ren-studio-android/**"
      - ".github/workflows/build-ren-studio-apk.yml"
  push:
    branches: [main]
    paths:
      - "ren-studio-android/**"
      - ".github/workflows/build-ren-studio-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: ren-studio-android
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp ren-studio-android/app/build/outputs/apk/debug/app-debug.apk REN-STUDIO.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: REN-STUDIO-APK
          path: REN-STUDIO.apk
          if-no-files-found: error
          retention-days: 30
