name: Regenerate Core 5 earthquake routing PWA shell
on:
  push:
    branches:
      - fix/core5-earthquake-scene-routing-2026-10-18
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/core5-earthquake-scene-routing-2026-10-18
      - name: Build deterministic offline release shell
        run: node scripts/build-pwa-shell.cjs
      - name: Commit worker regeneration
        run: |
          if git diff --quiet -- service-worker.js; then
            echo "PWA shell current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add service-worker.js
          git commit -m "Regenerate 5.1.12 PWA release shell"
          git push
