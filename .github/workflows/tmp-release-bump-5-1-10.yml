name: Temporary prepare workflow build 5.1.10
on:
  push:
    branches:
      - fix/mismatched-done-journal-reset-2026-10-17
permissions:
  contents: write
jobs:
  prepare:
    if: github.event.head_commit.message == 'Temporarily prepare workflow build 5.1.10'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mismatched-done-journal-reset-2026-10-17
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bump release identifiers only
        run: |
          perl -0pi -e "s/const BUILD='5\.1\.9'/const BUILD='5.1.10'/g" app-update.js
          perl -0pi -e 's/ner-core5-journal-store\.js\?v=5\.1\.8/ner-core5-journal-store.js?v=5.1.10/g; s/ner-core-5-audit-coordinator\.js\?v=5\.1\.8/ner-core-5-audit-coordinator.js?v=5.1.10/g; s/ner-core-5-editor\.js\?v=5\.1\.8/ner-core-5-editor.js?v=5.1.10/g; s/app-update\.js\?v=5\.1\.9/app-update.js?v=5.1.10/g' index.html
          perl -0pi -e 's/5\.1\.9/5.1.10/g' tests/core5-pwa-diagnostic-browser.cjs tests/core5-pwa-browser.cjs
          node scripts/build-pwa-shell.cjs
          node scripts/build-pwa-shell.cjs --check
      - name: Commit release files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-update.js index.html service-worker.js tests/core5-pwa-diagnostic-browser.cjs tests/core5-pwa-browser.cjs
          git diff --cached --quiet && exit 0
          git commit -m "Prepare workflow build 5.1.10 for stale journal reset"
          git push origin HEAD:fix/mismatched-done-journal-reset-2026-10-17
