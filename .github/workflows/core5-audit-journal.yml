name: Core 5 audit journal safety
on:
  push:
    branches:
      - fix/core5-audit-indexeddb-recovery-20261015
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  journal-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and migration tests
        run: |
          node --check ner-core5-journal-store.js
          node --check ner-core-5-audit-coordinator.js
          node --test tests/core5-journal-migration.test.cjs tests/core5-audit-duplicate.test.cjs
      - name: Install browser drivers and reliable Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1 puppeteer-core
          npx playwright install --with-deps chromium
      - name: Real browser IndexedDB checks
        run: CHROMIUM_PATH="$(node -p "require('playwright').chromium.executablePath()")" node tests/core5-journal-browser.cjs
