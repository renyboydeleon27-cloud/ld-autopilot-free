name: Valdivia PWA shell regeneration
on:
  push:
    branches: [fix/core5-valdivia-batch-p2-p14-20261019]
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/build-pwa-shell.cjs
      - run: |
          git config user.name github-actions
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add service-worker.js
          git diff --cached --quiet || (git commit -m 'Rebuild 5.1.23 PWA' && git push)
