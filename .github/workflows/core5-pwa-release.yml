name: Core 5 PWA release integrity
on:
  pull_request:
  push:
    branches: [main, fix/core5-pwa-update]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify release shell and free regression tests
        run: |
          node scripts/build-pwa-shell.cjs --check
          node --test tests/*.test.cjs tests/*.test.mjs tests/*.test.js
      - name: Install browser test dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Verify real cached-worker upgrades (no paid endpoints)
        run: |
          node tests/core5-pwa-diagnostic-browser.cjs
          node tests/core5-pwa-browser.cjs
