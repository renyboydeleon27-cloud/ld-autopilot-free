name: Temporary Core 5.1.11 shell build
on:
  push:
    branches:
      - fix/core5-clear-next-action-status-2026-10-17
permissions:
  contents: write
jobs:
  build-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/core5-clear-next-action-status-2026-10-17
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Align worker build and regenerate deterministic shell
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('service-worker.js')
          s=p.read_text()
          s=s.replace('NER Studio PWA Service Worker 5.1.10','NER Studio PWA Service Worker 5.1.11',1)
          s=s.replace("build:'5.1.10'","build:'5.1.11'",1)
          p.write_text(s)
          PY
          node scripts/build-pwa-shell.cjs
      - name: Commit generated shell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add service-worker.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Regenerate PWA shell for Core 5.1.11"
          git push
