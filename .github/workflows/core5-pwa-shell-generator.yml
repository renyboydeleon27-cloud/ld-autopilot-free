name: Core 5 PWA shell generator
on:
  push:
    branches:
      - fix/core5-audit-indexeddb-recovery-20261015
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/core5-audit-indexeddb-recovery-20261015
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate PWA shell
        run: |
          node scripts/build-pwa-shell.cjs
          node scripts/build-pwa-shell.cjs --check
      - name: Commit generated worker if changed
        run: |
          if git diff --quiet -- service-worker.js; then
            echo "service-worker.js already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add service-worker.js
          git commit -m "build: refresh PWA shell for Core 5 journal recovery"
          git push origin HEAD:fix/core5-audit-indexeddb-recovery-20261015
