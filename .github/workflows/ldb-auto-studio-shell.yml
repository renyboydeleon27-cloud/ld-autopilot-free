name: Update PWA shell on LDB feature branch
on:
  push:
    branches:
      - feature/ldb-auto-studio-ui
    paths:
      - index.html
      - service-worker.js
      - .github/workflows/ldb-auto-studio-shell.yml
permissions:
  contents: write
jobs:
  regenerate-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ldb-auto-studio-ui
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Rebuild deterministic PWA shell
        run: node scripts/build-pwa-shell.cjs
      - name: Commit generated service worker only when changed
        run: |
          if ! git diff --quiet -- service-worker.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add service-worker.js
            git commit -m "Regenerate PWA shell for LDB Auto Studio link"
            git push
          fi
