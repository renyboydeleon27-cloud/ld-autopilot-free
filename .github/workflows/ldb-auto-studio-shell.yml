name: Update PWA shell on LDB feature branch
on:
  push:
    branches:
      - feature/ldb-auto-studio-ui
    paths:
      - index.html
      - service-worker.js
      - .github/workflows/ldb-auto-studio-shell.yml
concurrency:
  group: ldb-pwa-shell-feature-branch
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  regenerate-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ldb-auto-studio-ui
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Rebuild deterministic PWA shell
        run: node scripts/build-pwa-shell.cjs
      - name: Commit generated worker with retry on concurrent branch updates
        run: |
          for attempt in 1 2 3 4 5; do
            git fetch origin feature/ldb-auto-studio-ui
            git reset --hard origin/feature/ldb-auto-studio-ui
            node scripts/build-pwa-shell.cjs
            if git diff --quiet -- service-worker.js; then
              echo "PWA shell already current"
              exit 0
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add service-worker.js
            git commit -m "Regenerate PWA shell for LDB Auto Studio navigation"
            if git push origin HEAD:feature/ldb-auto-studio-ui; then
              exit 0
            fi
            echo "Concurrent branch update; retrying with latest commit"
          done
          echo "Could not publish PWA shell after retries" >&2
          exit 1
