name: Temporary split PWA browser checks
on:
  push:
    branches:
      - fix/mismatched-done-journal-reset-2026-10-17
permissions:
  contents: read
jobs:
  browser-split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Project storage browser
        run: node tests/core5-project-storage-browser.cjs
      - name: Journal inspection browser
        run: node tests/core5-journal-inspection-browser.cjs
      - name: PWA diagnostic browser
        run: node tests/core5-pwa-diagnostic-browser.cjs
      - name: Cached worker browser
        run: node tests/core5-pwa-browser.cjs
