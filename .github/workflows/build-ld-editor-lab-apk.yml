name: Build LD Editor Lab APK

on:
  push:
    paths:
      - "ld-editor-lab/**"
      - ".github/workflows/build-ld-editor-lab-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Sync web assets into APK
        run: |
          mkdir -p ld-editor-lab/android/app/src/main/assets
          cp ld-editor-lab/index.html ld-editor-lab/android/app/src/main/assets/index.html
          cp ld-editor-lab/styles.css ld-editor-lab/android/app/src/main/assets/styles.css
          cp ld-editor-lab/app.js ld-editor-lab/android/app/src/main/assets/app.js

      - name: Build debug APK
        working-directory: ld-editor-lab/android
        run: gradle :app:assembleDebug --stacktrace

      - name: Stage APK
        run: |
          cp ld-editor-lab/android/app/build/outputs/apk/debug/app-debug.apk LD-Editor-Lab-v0.4.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LD-Editor-Lab-v0.4.0-APK
          path: LD-Editor-Lab-v0.3.0.apk
          if-no-files-found: error
          retention-days: 30
