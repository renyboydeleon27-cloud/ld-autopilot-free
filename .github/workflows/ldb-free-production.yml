name: LDB approved FREE prompt production

on:
  push:
    branches:
      - main
      - feature/ldb-auto-studio-ui
      - feature/ldb-production-quality
    paths:
      - "ldb-submissions/**"
      - "scripts/ldb*.py"
      - "scripts/ldb_profiles/**"
      - "tests/*ldb*"
      - "tests/ldb-google-delivery-bridge.test.mjs"
      - "tests/ldb-private-bridge-69-offline.test.mjs"
      - "tests/ldb-production-controls.test.mjs"
      - "tests/ldb-auto-text-assets.test.mjs"
      - "tests/verified-image-handoff.test.mjs"
      - "tests/verified-image-delivery.test.mjs"
      - "tests/approved-production-delivery.test.mjs"
      - "tests/submit-approved-delivery.test.mjs"
      - "tests/persisted-runner-images.test.mjs"
      - "tests/durable-image-asset-reader.test.mjs"
      - "tests/durable-text-assets.test.mjs"
      - "tests/durable-delivery-asset-reader.test.mjs"
      - "tests/resume-durable-approved-delivery.test.mjs"
      - "tests/production-delivery-69-offline.test.mjs"
      - "tests/delivery-readiness.test.mjs"
      - "tests/submit-durable-approved-delivery.test.mjs"
      - "lib/ldb/**"
      - "cloudflare/ldb-runner/**"
      - "cloudflare/ldb-google-vault/**"
      - "api/*ldb-google*"
      - ".github/workflows/ldb-free-production.yml"
      - ".github/workflows/ldb-auto-studio-tests.yml"
  workflow_dispatch:
    inputs:
      episode_folder:
        description: "Folder under ldb-submissions (leave blank to package all approved uploads)"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ldb-free-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The registered workflow on default branch exposes this branch-only mode
  # in its manual Run workflow entry point. Never invokes provider services.
  hook-v5-background-preflight:
    name: Prove secret-free GitHub background execution
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.actor == 'renyboydeleon27-cloud' &&
      github.ref == 'refs/heads/feature/ldb-hook-v5-cloud-executor' &&
      inputs.episode_folder == 'hook-v5-free-preflight'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Confirm owner and branch without secrets or API calls
        run: |
          set -eu
          test "$GITHUB_REPOSITORY" = "renyboydeleon27-cloud/ld-autopilot-free"
          test "$GITHUB_REF" = "refs/heads/feature/ldb-hook-v5-cloud-executor"
          test "$GITHUB_ACTOR" = "renyboydeleon27-cloud"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          {
            echo "### LDB AUTO STUDIO — Background preflight"
            echo "GitHub Actions job executed independently of a phone session."
            echo "Read-only, no code checkout, no API request, no secret, no image generation, no Drive, no Gmail."
            echo "HOOK V5 generation: NOT AUTHORIZED. Production: NO-GO."
          } >> "$GITHUB_STEP_SUMMARY"

  # Explicit dry rehearsal of the REAL image-prompt packager. This never
  # receives Cloudflare/Google secrets, calls AI, or creates any image.
  hook-v5-package-readiness:
    name: Verify approved HOOK V5 package offline
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.actor == 'renyboydeleon27-cloud' &&
      github.ref == 'refs/heads/feature/ldb-hook-v5-cloud-executor' &&
      inputs.episode_folder == 'hook-v5-offline-readiness'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Rehearse approved Lake Nyos HOOK V5 package without inference
        run: node scripts/ldb-hook-v5-offline-readiness.mjs
      - name: Report no-production boundary
        run: |
          {
            echo "### HOOK V5 package readiness"
            echo "PASS: exact approved 17-scene package, one HOOK-only revised prompt."
            echo "No Cloudflare Workers AI, Worker deployment, paid generation, Google Drive, Gmail or image approval."
            echo "Real rendering remains NO-GO pending protected execution environment and fresh Free-plan attestation."
          } >> "$GITHUB_STEP_SUMMARY"

  verified-storyboard-package:
    name: Validate approval and export free prompt package
    # Never run the normal packager for the two diagnostic sentinel inputs.
    if: >-
      github.event_name != 'workflow_dispatch' ||
      (inputs.episode_folder != 'hook-v5-free-preflight' &&
       inputs.episode_folder != 'hook-v5-offline-readiness')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install image decoder
        run: python -m pip install Pillow==12.3.0
      - name: Offline runner, provider gate and OAuth tests
        run: node --test tests/ldb-hook-cloud-test.test.mjs tests/ldb-approved-render-job.test.mjs tests/ldb-cloudflare-image.test.mjs tests/ldb-durable-checkpoints.test.mjs tests/ldb-google-oauth.test.cjs tests/ldb-google-vault.test.mjs tests/ldb-google-provision.test.mjs tests/ldb-google-delivery.test.mjs tests/ldb-auto-studio-ui.test.cjs tests/verified-image-handoff.test.mjs tests/verified-image-delivery.test.mjs tests/approved-production-delivery.test.mjs tests/submit-approved-delivery.test.mjs tests/persisted-runner-images.test.mjs tests/durable-image-asset-reader.test.mjs tests/durable-text-assets.test.mjs tests/durable-delivery-asset-reader.test.mjs tests/resume-durable-approved-delivery.test.mjs tests/production-delivery-69-offline.test.mjs tests/ldb-production-delivery.test.mjs tests/delivery-readiness.test.mjs tests/submit-durable-approved-delivery.test.mjs tests/ldb-google-delivery-bridge.test.mjs tests/ldb-private-bridge-69-offline.test.mjs tests/ldb-production-controls.test.mjs tests/ldb-auto-text-assets.test.mjs tests/ldb-prepare-hook-v5.test.mjs
      - name: Offline approval and output tests
        run: python -m unittest discover -s tests -p 'test_ldb*py' -v
      - name: Generate only for matching manual approvals
        id: pack
        env:
          EPISODE_FOLDER: ${{ inputs.episode_folder }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          from scripts.ldb_free_packager import make_package, make_package_from_bundle

          root = Path("ldb-submissions")
          requested = os.environ.get("EPISODE_FOLDER", "").strip()
          if requested and not re.fullmatch(r"[a-z0-9][a-z0-9-]{0,69}", requested):
              raise ValueError("Invalid episode folder name")
          folders = ([root / requested] if requested
                     else sorted(p for p in root.iterdir() if p.is_dir()) if root.exists() else [])
          output = Path(os.environ["RUNNER_TEMP"]) / "ldb-production-packages"
          count = 0
          for folder in folders:
              bundle = folder / "approved_bundle.json"
              storyboard = folder / "storyboard.json"
              approval = folder / "approval.json"
              if bundle.exists():
                  if storyboard.exists() or approval.exists():
                      raise ValueError(f"Choose bundled OR paired submission, not both: {folder}")
                  result = make_package_from_bundle(bundle, output / folder.name)
              elif storyboard.exists() or approval.exists():
                  if not storyboard.exists() or not approval.exists():
                      raise ValueError(f"Both storyboard.json and approval.json required in {folder}")
                  result = make_package(storyboard, approval, output / folder.name)
              else:
                  continue
              print(f"APPROVAL PASS: {result['topic']}: PROMPTS ONLY (0 actual images)")
              count += 1
          if not count:
              print("No approved input uploaded: no package generated.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"has_packages={'true' if count else 'false'}\n")
          PY
      - name: Upload organized free prompt packages
        if: steps.pack.outputs.has_packages == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ldb-approved-prompt-packages
          path: ${{ runner.temp }}/ldb-production-packages
          if-no-files-found: error
          retention-days: 30
      - name: Report honest completion boundary
        if: steps.pack.outputs.has_packages == 'true'
        run: |
          echo "PROMPT PACKAGE READY; NOT FINAL PRODUCTION."
          echo "Real image rendering, Flow video creation, Google Drive upload,"
          echo "and automated email notifications are not connected."
