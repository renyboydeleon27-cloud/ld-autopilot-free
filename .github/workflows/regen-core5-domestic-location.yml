name: Regenerate Core 5 PWA shell 5.1.25
on:
  push:
    branches: [fix/core5-valdivia-p8-domestic-geography-20261019]
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/core5-valdivia-p8-domestic-geography-20261019
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-pwa-shell.cjs
      - run: |
          git config user.name github-actions
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add service-worker.js
          git diff --cached --quiet || (git commit -m 'Rebuild PWA 5.1.25' && git push)
